name: Refresh football data

on:
  workflow_dispatch:
  schedule:
    - cron: "20 8 * * *"

permissions:
  contents: write

jobs:
  refresh:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: "pip"
      - name: Install dependencies
        run: pip install -r requirements.txt
      - name: Refresh real player snapshots
        run: python scripts/refresh_snapshots.py
      - name: Commit snapshots
        run: |
          git config user.name "latamdata-bot"
          git config user.email "latamdata-bot@users.noreply.github.com"
          git add data/snapshots
          if git diff --cached --quiet; then
            echo "No snapshot changes."
          else
            git commit -m "data: refresh player snapshots"
            git push
          fi
